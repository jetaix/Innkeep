name: CI

# The same checks as `bun run check`, and as the pre-push hook in `.githooks`
# (which leaves out the build). A pull request cannot be judged green without them.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome (format and lint)
        run: bunx biome ci .
      - name: TypeScript
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      # The client-rendered app that replaces the Next.js one: types, build and the first-view size budget.
      - name: New app (types, build, size budget)
        run: bun run web:check
