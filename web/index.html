<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Innkeep</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- The host's choice of light or dark, applied before anything is drawn. The key is THEME_KEY in src/i18n/config.ts. -->
    <script>
      try {
        const theme = localStorage.getItem("innkeep-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        // Storage refused (private window): follow the system.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
