<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Innkeep</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 9px 12px;
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button strong {
        display: block;
        font-weight: 600;
      }
      button span {
        opacity: 0.7;
        font-size: 12px;
      }
      button.primary {
        border-color: transparent;
        background: #18181b;
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        button.primary {
          background: #ededf0;
          color: #0f0f11;
        }
      }
      /* Safari on a phone shows the popup as a sheet as wide as the screen. */
      @media (pointer: coarse) {
        body {
          width: auto;
          font-size: 15px;
        }
      }
      /* The rule above would otherwise show a button marked hidden. */
      [hidden] {
        display: none !important;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        min-height: 1.4em;
        margin: 10px 0 0;
        font-size: 12px;
      }
      #settings {
        display: inline;
        width: auto;
        margin: 8px 0 0;
        padding: 0;
        border: 0;
        text-decoration: underline;
        opacity: 0.7;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Innkeep</h1>
    <button id="reservations" class="primary" type="button">
      <strong>Update reservations</strong>
      <span>Opens your two reservations pages, reads them, and returns to Innkeep.</span>
    </button>
    <button id="everything" type="button">
      <strong>Read everything</strong>
      <span>
        Also goes through your calendars, listing editor, extranet pages, public listing and reviews. A few
        minutes; keep the tab open.
      </span>
    </button>
    <button id="stop" type="button" hidden><strong>Stop the run</strong></button>
    <p id="status" role="status"></p>
    <button id="settings" type="button">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
